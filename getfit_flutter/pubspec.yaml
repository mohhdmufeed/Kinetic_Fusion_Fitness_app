name: getfit
description: GetFit — Offline-first fitness tracker powered by wger
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local database (SQLite, type-safe)
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.22

  # HTTP client
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Connectivity
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.68.0

  # Image picker (for gallery / profile photo)
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.19.0

  # Path provider (for DB file)
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cached network images
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
