<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GetFit - Fitness & Workout Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GetFit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GetFit - Fitness Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #26496C;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 440px;
      width: 90%;
    }
    .logo-hexagon {
      width: 72px;
      height: 72px;
      background: #ffffff;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .logo-icon {
      font-size: 32px;
      color: #26496C;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    p.sub {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 24px;
    }
    .card-box {
      background: #ffffff;
      color: #333333;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      margin-bottom: 20px;
    }
    .apk-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #26496C;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 8px;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(38,73,108,0.3);
    }
    .apk-btn:hover {
      background-color: #1b3550;
    }
    .apk-btn:active {
      transform: scale(0.98);
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .web-loading-text {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-hexagon">
      <span class="logo-icon">🏋️</span>
    </div>
    <h1>GetFit</h1>
    <p class="sub">Offline-Ready Fitness & Workout Hub</p>

    <div class="card-box">
      <h3 style="font-size: 17px; margin-bottom: 8px; color: #26496C;">Android Mobile App</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 16px;">Download and install the native Android APK directly on your phone:</p>
      <a href="GetFit.apk" class="apk-btn" download="GetFit.apk">
        <span>📲 Download GetFit APK</span>
      </a>
    </div>

    <div class="spinner"></div>
    <div class="web-loading-text">Loading Web App interface...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
